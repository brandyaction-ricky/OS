<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrandyAction OS 업무 공정 대시보드" />
    <title>BrandyAction OS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="BrandyAction OS 홈">
          <span class="brand-mark">BA</span>
          <span><strong>BrandyAction</strong><small>Execution OS</small></span>
        </a>

        <nav class="nav" aria-label="주 메뉴">
          <button class="nav-item is-active" data-view="dashboard">
            <span class="nav-icon">⌂</span><span>전체 업무 공정</span>
          </button>
          <button class="nav-item" data-view="tasks">
            <span class="nav-icon">✓</span><span>내가 할 일</span><em id="task-count">0</em>
          </button>
          <button class="nav-item" data-view="youtube">
            <span class="nav-icon">▶</span><span>유튜브 제작</span>
          </button>
          <button class="nav-item" data-view="contents">
            <span class="nav-icon">▤</span><span>콘텐츠 Run</span>
          </button>
          <button class="nav-item" data-view="meetings">
            <span class="nav-icon">▥</span><span>회의 노트</span><em id="meeting-count">0</em>
          </button>
          <button class="nav-item" data-view="approvals">
            <span class="nav-icon">◇</span><span>결재함</span><em id="approval-count">0</em>
          </button>
          <button class="nav-item" data-view="people">
            <span class="nav-icon">◫</span><span>직원 워크스페이스</span><em id="people-count">0</em>
          </button>
          <button class="nav-item" data-view="wiki">
            <span class="nav-icon">▣</span><span>Wiki</span>
          </button>
          <button class="nav-item" data-view="skills">
            <span class="nav-icon">✦</span><span>OS Access Skills</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <p>Git + Markdown Source of Truth</p>
          <span id="sync-time">동기화 확인 중</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="메뉴 열기">☰</button>
          <div class="page-heading">
            <p>BRANDYACTION OS</p>
            <h1 id="page-title">전체 업무 공정</h1>
          </div>
          <div class="top-actions">
            <label class="user-select">
              <span>작업자</span>
              <select id="user-select" aria-label="현재 작업자"></select>
            </label>
            <span class="health"><i></i>Repository 정상</span>
          </div>
        </header>

        <div class="content" id="app">
          <section class="loading-card">
            <div class="spinner"></div>
            <p>OS Repository를 읽고 있습니다.</p>
          </section>
        </div>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="콘텐츠 상세" aria-hidden="true">
      <button class="drawer-close" id="drawer-close" aria-label="닫기">×</button>
      <div id="drawer-content"></div>
    </aside>

    <div class="modal-backdrop" id="submit-backdrop" hidden></div>
    <section class="submit-modal" id="submit-modal" role="dialog" aria-modal="true" aria-labelledby="submit-title" aria-hidden="true">
      <button class="drawer-close" id="submit-close" aria-label="닫기">×</button>
      <p class="drawer-kicker">OS WEB PUSH</p>
      <h2 id="submit-title">작업 제출</h2>
      <p class="submit-description" id="submit-description"></p>
      <form id="submit-form">
        <input type="hidden" id="submit-content-id" />
        <input type="hidden" id="submit-step" />
        <input type="hidden" id="submit-mode" />
        <label class="form-field" id="submit-artifact-field"><span>산출물 종류</span><select id="submit-artifact-key"></select></label>
        <label class="form-field"><span>결과 요약 <b>필수</b></span><textarea id="submit-summary" rows="5" maxlength="10000" required placeholder="무엇을 완료했고, 다음 담당자가 무엇을 확인해야 하는지 적어주세요."></textarea></label>
        <label class="form-field"><span>결과물 자산 ID</span><input id="submit-asset-url" type="text" maxlength="2000" placeholder="asset://longform/BA-0268/edit.mp4" /><small>공개 OS에는 서명 URL 대신 자산 식별자만 저장합니다.</small></label>
        <label class="form-field"><span>Checksum 또는 Asset ID</span><input id="submit-checksum" type="text" maxlength="300" placeholder="선택 입력" /></label>
        <label class="form-field"><span>결과 Markdown</span><input id="submit-markdown" type="file" accept=".md,text/markdown,text/plain" /><small>선택 사항 · 1.5MB 이하 · content_id와 step이 일치해야 합니다.</small></label>
        <label class="form-field"><span>OS 작업 코드 <b>필수</b></span><input id="submit-secret" type="password" autocomplete="current-password" required placeholder="관리자에게 받은 작업 코드" /></label>
        <div class="submit-feedback" id="submit-feedback" role="status"></div>
        <button class="primary-action submit-button" id="submit-button" type="submit">Repository에 반영</button>
      </form>
    </section>

    <template id="empty-template">
      <section class="empty-state">
        <span>✓</span>
        <h2>현재 항목이 없습니다</h2>
        <p>Repository가 갱신되면 이 화면에 자동으로 표시됩니다.</p>
      </section>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
