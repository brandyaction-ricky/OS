<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrandyAction OS 업무 공정 대시보드" />
    <title>BrandyAction OS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="BrandyAction OS 홈">
          <span class="brand-mark">BA</span>
          <span><strong>BrandyAction</strong><small>Execution OS</small></span>
        </a>

        <nav class="nav" aria-label="주 메뉴">
          <button class="nav-item is-active" data-view="dashboard">
            <span class="nav-icon">⌂</span><span>전체 업무 공정</span>
          </button>
          <button class="nav-item" data-view="tasks">
            <span class="nav-icon">✓</span><span>내가 할 일</span><em id="task-count">0</em>
          </button>
          <button class="nav-item" data-view="contents">
            <span class="nav-icon">▤</span><span>콘텐츠 Run</span>
          </button>
          <button class="nav-item" data-view="approvals">
            <span class="nav-icon">◇</span><span>결재함</span><em id="approval-count">0</em>
          </button>
          <button class="nav-item" data-view="skills">
            <span class="nav-icon">✦</span><span>Skill Library</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <p>Git + Markdown Source of Truth</p>
          <span id="sync-time">동기화 확인 중</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="메뉴 열기">☰</button>
          <div class="page-heading">
            <p>BRANDYACTION OS</p>
            <h1 id="page-title">전체 업무 공정</h1>
          </div>
          <div class="top-actions">
            <label class="user-select">
              <span>작업자</span>
              <select id="user-select" aria-label="현재 작업자"></select>
            </label>
            <span class="health"><i></i>Repository 정상</span>
          </div>
        </header>

        <div class="content" id="app">
          <section class="loading-card">
            <div class="spinner"></div>
            <p>OS Repository를 읽고 있습니다.</p>
          </section>
        </div>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="콘텐츠 상세" aria-hidden="true">
      <button class="drawer-close" id="drawer-close" aria-label="닫기">×</button>
      <div id="drawer-content"></div>
    </aside>

    <template id="empty-template">
      <section class="empty-state">
        <span>✓</span>
        <h2>현재 항목이 없습니다</h2>
        <p>Repository가 갱신되면 이 화면에 자동으로 표시됩니다.</p>
      </section>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
