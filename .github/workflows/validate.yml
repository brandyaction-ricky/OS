name: Validate BrandyAction OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CLI
        run: python -m pip install -e .

      - name: Validate Markdown repository
        run: ba validate

      - name: Run tests
        run: python -m unittest discover -s tests -v
