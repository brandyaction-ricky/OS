name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_SERVER_MODE: production
      - name: Verify enabled HR demo workflows
        run: npm run test:e2e -- tests/e2e/hr.spec.ts
        env:
          PLAYWRIGHT_SERVER_MODE: production
          HR_WORKSPACE_ENABLED: "true"
          HR_E2E_DEMO: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
      - name: Verify portrait diagram editing, the 숏폼 topic research, 주제 찾기 and video feedback
        run: npm run test:e2e -- tests/e2e/shortform-diagrams.spec.ts tests/e2e/shortform-topic-research.spec.ts tests/e2e/topic-hub.spec.ts tests/e2e/video-feedback.spec.ts
        env:
          PLAYWRIGHT_SERVER_MODE: production
          YOUTUBE_V1_ENABLED: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
      - name: Verify Threads planning, Aside handoff and API publication with isolated fixtures
        run: npm run test:e2e -- tests/e2e/threads-reference.mock.spec.ts tests/e2e/threads-editorial.mock.spec.ts tests/e2e/threads-aside-handoff.mock.spec.ts tests/e2e/threads-api-publication.mock.spec.ts
        env:
          REFERENCE_MOCK_E2E: "true"
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_SUPABASE_URL: "https://reference-ui-test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "fixture-public-key"
