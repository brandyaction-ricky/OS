openapi: 3.1.0
info:
  title: Brandyaction OS API
  version: 2.3.0
  description: 지식·업무·목표·콘텐츠·성과를 연결하는 브랜디액션 운영 API
servers:
  - url: https://brandyaction-os.vercel.app
security:
  - bearerAuth: []
paths:
  /api/v1/approvals:
    get:
      summary: 활성 승인자·위임 목록과 문서별 승인 가능 여부
      description: 문서별 판정은 documentId, 소구점 후보별 판정은 recordId 쿼리로 요청하며 작성자 자기 승인은 항상 거절합니다. 연결된 DB에 승인 마이그레이션이 없으면 실패 상태를 반환합니다.
      parameters:
        - in: query
          name: documentId
          schema: { type: string, format: uuid }
        - in: query
          name: recordId
          schema: { type: string, format: uuid }
      responses:
        "200": { description: assignments와 canApprove }
        "403": { description: 구성원 계정 필요 }
        "503": { description: 승인 설정 마이그레이션 적용 대기 }
    post:
      summary: 승인자 지정·기간 위임·해제
      description: add_approver는 관리자만, delegate는 현재 승인자만, revoke는 관리자 또는 해당 위임자만 수행합니다. 대상은 활성 구성원이어야 합니다.
      responses:
        "200": { description: 해제된 assignment }
        "201": { description: 생성된 assignment }
        "400": { description: 잘못된 입력·비활성 구성원 }
        "403": { description: 승인자 관리 권한 없음 }
        "409": { description: 중복 지정·동시 변경 }
  /api/v1/content/appeals/decide:
    post:
      summary: 사람 승인자의 소구점 후보 일괄 판정
      description: id, expectedVersion, candidateSetVersion와 entries(index, decision, note)를 받습니다. 작성자는 자기 후보를 승인할 수 없고 수정 요청에는 사유가 필요합니다. 일반 기록 API로 판정 필드를 변경할 수 없습니다.
      responses:
        "200": { description: 판정 이력이 추가된 record }
        "400": { description: 후보·사유·입력 검증 실패 }
        "403": { description: 작성자·비승인자·AI 키 }
        "409": { description: 후보 세트 또는 기록 버전 충돌 }
  /api/v1/content/appeals/request:
    post:
      summary: 네 칸의 기획 준비도를 확인하고 소구점 승인 요청 알림 발송
      description: packageId와 expectedVersion 필요. 대표 시청자·사람들이 찾는 말·콘텐츠 위계·시장 근거 영상 주소를 확인한 뒤 현재 승인자 및 유효 위임자에게 멱등 알림을 보냅니다.
      responses:
        "200": { description: requested와 recipientCount }
        "409": { description: 준비도 누락·버전 변경·승인자 없음 }
        "503": { description: 알림 또는 승인 규칙 마이그레이션 적용 대기 }
  /api/v1/content/appeals/comments:
    get:
      summary: 현재 후보 세트의 후보별 추가형 댓글 조회
      parameters:
        - { in: query, name: packageId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: comments }
    post:
      summary: 후보별 댓글 추가
      description: packageId, expectedVersion, candidateSetVersion, index, body 필요. 기존 댓글은 수정하거나 삭제하지 않습니다.
      responses:
        "201": { description: 추가된 comment }
        "409": { description: 후보 세트 버전 변경 }
  /api/v1/content/comments:
    get:
      summary: 최근 댓글 목록과 본인·공유 처리 권한
      description: 사람 로그인/RLS 범위에서 최근 200건. comments[].canRespond/teamShared와 truncated를 반환하며 채널 토큰·비공유 계정의 이름은 반환하지 않습니다.
      responses:
        "200": { description: 댓글 목록 }
        "503": { description: 댓글·채널 저장소 준비 필요 }
    post:
      summary: 댓글 분류·담당·주제 전환·초안·모의 답글/숨기기
      description: id/expectedVersion/operation 필요. assign/classify/topic/draft는 활성 직원에게 열려 있습니다. reply/hide는 본인 또는 공유 계정 및 confirm=true가 필요합니다. Threads는 최상위 답글만 숨김. draft 기본 queue는 202와 jobId, 명시적 api는 저장된 초안과 생성 기록을 반환합니다. 실계정 답글·숨기기는 별도 검수 전 503.
      responses:
        "200": { description: comment 또는 topicId }
        "202": { description: 구독 대기열 요청 저장 }
        "403": { description: 채널 처리 권한 없음 }
        "409": { description: 버전 충돌 또는 이미 처리됨 }
        "503": { description: 실계정 처리 미공개 또는 API 준비 필요 }
  /api/v1/content/publish:
    post:
      summary: 사람 전용 채널 게시 편집·승인·예약·모의 게시
      description: id/expectedVersion/operation 필요. operation은 edit, approve, schedule, reschedule, publish, manual_done. 선택한 계정의 본인 또는 팀 공유 사용자만 가능. edit은 settings를 받고 재승인 필요 상태로 저장합니다. approve/publish/manual_done은 confirm=true가 필요합니다. 실계정 API 게시는 별도 DB 보안 검수 전 503으로 잠겨 있습니다. 기존 사용자 RLS 쓰기 유지.
      responses:
        "200": { description: 갱신된 record }
        "400": { description: 입력·사람 확인·게시 파일 검증 실패 }
        "403": { description: 비공유 채널 또는 AI 키 사용 거절 }
        "409": { description: 버전 충돌·승인 필요·중간 결과 확인 필요 }
        "503": { description: 실계정 API 게시 미공개 }
  /api/v1/content/channel-sync:
    get:
      summary: 인증된 예약 작업의 알림·댓글·성과 수집
      description: CRON_SECRET Bearer 인증. CHANNEL_SYNC_ENABLED=true이고 demo가 아닐 때만 실행. 예약·만료 알림을 저장한 뒤 최근 14일 게시물 댓글과 D1/D7/D28 성과를 순서대로 수집합니다. 게시·답글·숨기기는 실행하지 않습니다. 기존 댓글·수기 성과를 덮어쓰지 않으며 범위 초과는 truncated로 반환합니다. Telegram 실패는 응답 수치로 남기고 OS 알림은 유지됩니다.
      responses:
        "200": { description: 활성 여부와 알림·댓글·성과 수집 및 실패·범위 초과 수치 }
        "401": { description: 예약 작업 인증 실패 }
        "503": { description: DB 준비 필요 }
  /api/v1/channels:
    get:
      summary: 내 채널과 팀 공유 채널 목록
      description: 사람 로그인만 허용. 기본은 내 채널·팀 공유만. scope=company는 관리자만 허용하며 그 외 역할은 403. 암호화 토큰과 Meta 외부 계정 ID는 반환하지 않습니다.
      responses:
        "200": { description: connections 배열과 Meta mode(mock 또는 live) }
        "503": { description: 추가 마이그레이션 적용 필요 }
  /api/v1/meta/{action}:
    parameters:
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [status, start, test, share, disconnect, refresh] }
    get:
      summary: status — 안전한 연결 상태 조회
      responses:
        "200": { description: 내 채널과 팀 공유 채널 }
    post:
      summary: Meta 연결 관리
      description: 기본 모의 모드. start/share는 본인만, disconnect는 본인 또는 관리자, test/refresh는 본인 또는 팀 공유. 실제 OAuth·게시는 별도 환경 승인 대상.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [instagram, threads] }
                ownerId: { type: string, format: uuid }
                teamShared: { type: boolean }
      responses:
        "200": { description: 처리 결과 또는 authorizationUrl }
        "403": { description: 연결 권한 없음 }
        "409": { description: 중복·교체·모드 불일치 }
  /api/v1/meta/tester:
    get:
      summary: 본인 요청 또는 관리자 전체 테스터 등록 요청 조회
      responses:
        "200": { description: requests 배열 }
    post:
      summary: 관리자에게 Meta 테스터 등록 요청
      description: body.platform instagram 또는 threads. OS 알림만 생성하며 외부 Meta 역할은 자동 변경하지 않습니다.
      responses:
        "200": { description: 요청 기록 }
    patch:
      summary: 관리자가 외부 테스터 등록 확인
      description: body.id, expectedVersion, registered(true). 본인 연결은 해당 사용자 OAuth로만 가능합니다.
      responses:
        "200": { description: 저장된 요청 }
        "403": { description: 관리자 아님 }
        "409": { description: 버전 충돌 }
  /api/v1/youtube/oauth:
    get:
      summary: 내 YouTube OAuth 상태
      responses:
        "200": { description: 기존 상태 필드에 ownerId와 teamShared 추가 }
    post:
      summary: 본인 YouTube 연결 시작
      responses:
        "200": { description: authorizationUrl }
    patch:
      summary: 본인 채널 팀 공유 변경
      description: body.teamShared boolean
      responses:
        "200": { description: 공유 설정 저장 }
    delete:
      summary: 본인 또는 관리자 채널 해제
      parameters:
        - in: query
          name: ownerId
          schema: { type: string, format: uuid }
      responses:
        "200": { description: 해제됨 }
  /api/v1/youtube/oauth/test:
    post:
      summary: 본인 또는 공유 채널의 실제 연결 확인
      description: body.ownerId 선택. 실제 Google 채널을 조회하고 성공 변경 기록을 저장합니다.
      responses:
        "200": { description: ok와 checkedAt }
        "403": { description: 채널 권한 없음 }
  /api/v1/youtube/upload/session:
    post:
      summary: 승인한 YouTube 업로드 세션 생성
      description: 기존 kitId/fileName/fileSize/mimeType/privacyStatus/finalApproval 계약 유지. 선택 필드 connectionOwnerId 추가. 본인 또는 팀 공유만 허용. 현재 공정·발행 승인과 채널·공개 범위를 검사합니다.
      responses:
        "200": { description: 업로드 세션 }
        "403": { description: 채널 사용 권한 없음 }
        "409": { description: 승인 조건 변경 }
  /api/v1/youtube/upload/complete:
    post:
      summary: 실제 업로드 결과 확인 및 OS 기록
      description: 기존 kitId/videoId/privacyStatus/finalApproval 계약 유지. 선택 필드 connectionOwnerId 추가. 재시도는 최초 연결 소유자와 영상 ID를 유지합니다.
      responses:
        "200": { description: 확인된 영상과 발행 기록 }
        "403": { description: 채널 사용 권한 없음 }
        "409": { description: 영상 소유권 또는 기록 버전 충돌 }
  /api/v1/content/generate:
    post:
      summary: 회사 절차 정본 기반 콘텐츠 생성·자가검수
      description: 기본 mode=queue는 ai_job만 저장하고 외부 모델을 호출하지 않습니다. mode=api는 사람이 명시적으로 요청할 때만 즉시 생성하며 실행·사용량·결과 ID를 기록합니다. 외부 발행은 수행하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, sourceId]
              properties:
                mode: { type: string, enum: [queue, api], default: queue }
                action: { type: string, enum: [derivatives, title_package, shorts_proposal, youtube_kit] }
                sourceId: { type: string, format: uuid }
                platforms: { type: array, items: { type: string, enum: [shorts, threads, column, instagram, essay] } }
                count: { type: integer, minimum: 1, maximum: 12, default: 5 }
      responses:
        "201": { description: 정본 실행 및 자가검수 후 검토 기록 생성 }
        "202": { description: 구독 대기열 작업 생성 또는 동일 요청 재사용 }
        "409": { description: 실행 절차 정본 없음 }
  /api/v1/health:
    get:
      security: []
      summary: 서버와 외부 연결 준비 상태 확인
      description: 기존 키는 호환을 위해 유지. checks 배열의 status와 lastOkAt은 실제 호출 범위를 나타내며 환경 설정만 있으면 unverified. checkedAt은 마지막 스냅샷 시각.
      responses:
        "200":
          description: 상태 스냅샷
  /api/v1/search/progress:
    get:
      summary: 로그인한 사용자가 접근 가능한 현재 문서의 색인 작업 집계
      description: 사용자 RLS로 문서 범위를 제한하고 현재 content_hash의 최신 작업을 문서당 한 번 집계합니다. 청크 검증률은 아닙니다. 문서 ID와 오류 원문을 반환하지 않으며 부분 조회는 truncated로 표시합니다. 에이전트 키는 허용하지 않습니다.
      responses:
        "200":
          description: private no-store 색인 현황
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage: { $ref: "#/components/schemas/IndexCoverage" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /api/v1/search:
    post:
      summary: 권한 범위 안에서 회사 지식 검색
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 인용 가능한 검색 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
  /api/v1/documents:
    get:
      summary: RLS가 허용하는 문서 목록
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
        - { in: query, name: statuses, schema: { type: string }, description: 쉼표로 구분한 상태 }
        - { in: query, name: folder, schema: { type: string } }
        - { in: query, name: owner, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        "200": { description: 문서 목록 }
    post:
      summary: 개인 초안 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreate"
      responses:
        "201": { description: 생성된 문서와 색인 상태 }
        "400": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError", description: 같은 source/sourceRef 원본이 이미 존재함 }
    patch:
      summary: 기대 버전을 확인한 뒤 문서 수정. 정본 제목·본문은 변경 제안으로 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DocumentCreate"
                - type: object
                  required: [id, expectedVersion]
                  properties:
                    id: { type: string, format: uuid }
                    expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { description: 수정된 문서와 색인 상태 }
        "202": { description: 정본은 그대로이며 proposal 필드에 열린 변경 제안을 반환 }
        "409": { $ref: "#/components/responses/ApiError" }
    delete:
      summary: 문서를 삭제하지 않고 보관 상태로 전환
      parameters:
        - { in: query, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 보관 완료 }
  /api/v1/documents/{id}:
    get:
      summary: 문서 원문 조회
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 문서 원문 }
        "404": { $ref: "#/components/responses/ApiError" }
  /api/v1/knowledge-documents:
    get:
      summary: 직원 AI가 권한 범위의 문서 원문 조회
      parameters:
        - { in: query, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: documentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 문서 원문과 현재 버전 }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      summary: knowledge.write PAT로 개인 초안 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, title, contentMd]
              properties:
                organizationId: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 200 }
                contentMd: { type: string, minLength: 1, maxLength: 1500000 }
                folder: { type: string, maxLength: 160, default: AI 저장/검토 대기 }
                tags: { type: array, maxItems: 30, items: { type: string, maxLength: 60 } }
                status: { type: string, enum: [personal_draft, draft], default: personal_draft }
                reason: { type: string, maxLength: 500 }
      responses:
        "201": { description: 생성 문서, documentId와 색인 상태 }
        "429": { $ref: "#/components/responses/ApiError" }
    patch:
      summary: knowledge.write PAT로 버전을 남기고 문서 수정. 새 정본 쓰기 키는 제안을 생성하고 기존 키 동작은 유지
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, documentId]
              properties:
                organizationId: { type: string, format: uuid }
                documentId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 200 }
                contentMd: { type: string, minLength: 1, maxLength: 1500000 }
                folder: { type: string, maxLength: 160 }
                tags: { type: array, maxItems: 30, items: { type: string, maxLength: 60 } }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: 수정 문서와 새 버전 }
        "202": { description: 정본은 그대로이며 proposalId와 proposal 필드로 변경 제안 반환 }
        "409": { $ref: "#/components/responses/ApiError" }
        "429": { $ref: "#/components/responses/ApiError" }
    delete:
      summary: knowledge.write PAT로 영구 삭제 없이 휴지통 이동
      parameters:
        - { in: query, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: documentId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: reason, schema: { type: string, maxLength: 500 } }
      responses:
        "200": { description: permanent=false인 휴지통 이동 결과 }
        "429": { $ref: "#/components/responses/ApiError" }
  /api/v1/documents/{id}/status:
    post:
      summary: 서버의 상태 전환 정책에 따라 문서 상태 변경
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/DocumentStatus" }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: 변경된 문서 }
        "400": { $ref: "#/components/responses/ApiError" }
  /api/v1/documents/{id}/versions:
    get:
      summary: 접근 가능한 문서의 버전 이력 조회
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 수정자·사유·시각을 포함한 버전 목록 }
    post:
      summary: 선택한 과거 버전을 새 버전으로 복원. 정본은 변경 제안으로 저장
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 복원된 최신 문서 }
        "202": { description: 정본은 그대로이며 proposal 필드에 열린 변경 제안을 반환 }
  /api/v1/documents/proposals:
    get:
      summary: 읽을 수 있는 정본의 열린 변경 제안 목록 또는 단일 제안·댓글
      parameters:
        - { in: query, name: id, schema: { type: string, format: uuid } }
      responses:
        "200": { description: proposals, documents, comments }
    post:
      summary: 줄 댓글 또는 승인·보완·철회
      description: action=approve는 작성자와 다른 승인자/위임자가 기준 버전을 확인한 뒤 새 정본 버전을 만듭니다. action=return은 보완 사유가 필요하며 action=withdraw는 작성자만 할 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, proposalId]
              properties:
                action: { type: string, enum: [comment, approve, return, withdraw] }
                proposalId: { type: string, format: uuid }
                lineNo: { type: integer, minimum: 1 }
                body: { type: string, maxLength: 2000 }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: 처리된 제안과 승인 시 새 정본 }
        "201": { description: 저장된 줄 댓글 }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /api/v1/records:
    get:
      summary: 권한 범위 안의 운영 기록 목록
      description: notification 및 development_notification은 일반 기록 API에서 읽기·생성·변경·복원이 금지됩니다.
      parameters:
        - { in: query, name: type, schema: { $ref: "#/components/schemas/RecordType" } }
        - { in: query, name: id, schema: { type: string, format: uuid }, description: 직접 연결된 단일 항목 조회 }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: brand, schema: { type: string } }
        - { in: query, name: team, schema: { type: string } }
        - { in: query, name: assignee, schema: { type: string }, description: UUID 또는 me }
        - { in: query, name: q, schema: { type: string, maxLength: 200 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: 운영 기록 목록 }
    post:
      summary: 업무·목표·회의·콘텐츠·성과 기록 생성
      description: 기존 계약 유지. task의 metadata.extractionReviewed=true는 활성 구성원 assigneeId, 유효 dueDate, 접근 가능한 원본 회의(metadata.meetingId 또는 parentId)를 요구합니다. 회의 검수 항목은 metadata.reviewItems, 업무 완료 기준은 metadata.doneCriteria로 추가됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCreate" }
      responses:
        "201": { description: 생성된 운영 기록 }
        "400": { $ref: "#/components/responses/ApiError" }
    patch:
      summary: 기대 버전을 확인한 뒤 운영 기록 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RecordCreate"
                - type: object
                  required: [id, expectedVersion]
                  properties:
                    id: { type: string, format: uuid }
                    expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { description: 수정된 운영 기록 }
        "409": { $ref: "#/components/responses/ApiError" }
    delete:
      summary: 운영 기록을 삭제하지 않고 보관
      parameters:
        - { in: query, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 보관 완료 }
  /api/v1/meeting-recordings:
    post:
      summary: 인증된 구성원의 비공개 회의 녹음 업로드
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 4MB 이하 audio/webm, audio/ogg, audio/mpeg }
      responses:
        "201": { description: 비공개 Storage 경로 }
        "413": { $ref: "#/components/responses/ApiError" }
    get:
      summary: 회의 녹음의 1시간 유효 서명 URL 발급
      parameters:
        - { in: query, name: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 서명 재생 URL }
        "404": { $ref: "#/components/responses/ApiError" }
  /api/v1/meeting-summary:
    post:
      summary: 회의 원문 기반 요약 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript]
              properties:
                transcript: { type: string, minLength: 20, maxLength: 200000 }
      responses:
        "200": { description: 요약·결정·미해결·담당/기한 업무와 mode }
        "400": { $ref: "#/components/responses/ApiError" }
  /api/v1/meeting-transcription:
    post:
      summary: 4MB 이하 회의 녹음을 한국어 원문으로 전사
      responses:
        "200": { description: 전사 원문 }
        "413": { $ref: "#/components/responses/ApiError" }
  /api/v1/meeting-prep:
    get:
      summary: 이전 미해결 안건·완료 전 업무·주간 KPI 회의 준비
      responses:
        "200": { description: 다음 회의 준비 자료 }
  /api/v1/members:
    get:
      summary: 실제 로그인 구성원 목록
      responses:
        "200": { description: 역할·팀·사용 상태 목록 }
    patch:
      summary: 관리자가 구성원 역할·팀·사용 상태 변경
      responses:
        "200": { description: 변경된 구성원 }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/audit:
    get:
      summary: 운영 기록·지식 문서·AI 에이전트 변경 이력
      responses:
        "200": { description: 관리자 전체 또는 사용자 본인 변경 이력 }
  /api/v1/agent-keys:
    get:
      summary: 관리자용 Agent PAT 목록
      responses:
        "200": { description: 키 메타데이터 목록 }
    post:
      summary: 관리자용 읽기 또는 읽기·쓰기 Agent PAT 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expiresAt]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                ownerUserId: { type: string, format: uuid }
                access: { type: string, enum: [read, draft, write], default: read, description: "draft allows non-canonical document writes while retaining company-reference reads; existing keys retain their previous effective policy." }
                team: { type: string, maxLength: 120 }
                brand: { type: [string, "null"], maxLength: 120 }
                expiresAt: { type: string, format: date-time, description: "Required future expiration for newly issued keys. Existing non-expiring keys are unchanged." }
      responses:
        "201": { description: 최초 한 번만 표시하는 원문 토큰 }
    delete:
      summary: Agent PAT 폐기
      parameters:
        - { in: query, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 폐기 완료 }
  /api/v1/indexing:
    get:
      summary: 관리자용 임베딩 큐 상태 조회
      responses:
        "200": { description: 기존 전체 작업 pending/running/failed/done 건수와 설정 상태 및 현재 활성 문서의 coverage 집계 }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      summary: 관리자가 제한된 인덱싱 배치를 실행하거나 현재 버전 실패 작업을 대기로 전환
      description: retry_failed는 활성 문서의 현재 hash 최신 실패만 대상으로 하며 이미 실행 중인 작업과 대체된 버전은 제외합니다. 부분 조회 시 쓰지 않고 실패합니다. 실제 재처리는 운영 승인을 받은 뒤 실행합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [process, retry_failed] }
                limit: { type: integer, minimum: 1, maximum: 500, default: 25 }
      responses:
        "200": { description: 배치 처리 또는 재시도 결과 }
        "403": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /api/v1/indexing/cron:
    get:
      security: []
      summary: Vercel 예약 인덱싱·광고 성과 배치
      description: Authorization Bearer CRON_SECRET가 일치할 때 임베딩 큐와 최근 7일 광고 지표를 처리
      responses:
        "200": { description: 배치 처리 결과 또는 미설정 건너뜀 }
        "401": { $ref: "#/components/responses/ApiError" }
  /api/v1/ad-performance:
    get:
      summary: Meta·Google 광고 성과 일별 집계 조회
      description: >-
        기존 rows, channels, summary 필드는 유지한다. channels와 summary의 spend,
        attributedRevenue, conversions, impressions, clicks, roas, cpa, ctr 및
        summary.operatingRevenue는 number 또는 null. 미수집 집계와 분모 0의 비율은 null이며
        실제 기록된 0은 0을 유지한다. sampleCount는 집계 행 수, financeVisible은 재무 조회 권한,
        lastCollectedAt은 선택 범위의 마지막 저장 시각이다. financeAdExpense null은 권한 없음
        또는 미수집을 뜻하며 financeVisible로 구분한다. 조회 오류를 0으로 반환하지 않는다.
      parameters:
        - { in: query, name: period, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { in: query, name: brand, schema: { type: string, enum: [all, myin, brandyedu] } }
      responses:
        "200": { description: 연결 상태, 일별 지표, 채널·전체 집계와 권한별 재무 교차값 }
        "401": { $ref: "#/components/responses/ApiError" }
    post:
      summary: 관리자가 광고 성과 범위를 읽기 전용으로 동기화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                provider: { type: string, enum: [meta, google, all], default: all }
                brands: { type: array, items: { type: string, enum: [myin, brandyedu] } }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "200": { description: 공급자·브랜드별 처리 결과 }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/connections:
    get:
      summary: 관리자용 연결 확인 이력과 담당자 조회
      description: checks는 마지막 성공 호출, 최근 테스트·기록 시작 이후 색인 시도·광고 수집 실패와 현재 막힌 작업, 담당 정·부와 변경 버전을 포함한다. 이력 조회 불가일 때 실패 수는 null이며 정상으로 표시하지 않는다.
      responses:
        "200": { description: checks 및 checkedAt. 비밀값과 제공자 응답 본문은 반환하지 않음 }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      summary: 관리자가 service로 지정한 연결에 읽기 전용 테스트 실행
      description: 현재 사용자 인증 뒤 고정 제공자 주소만 호출. 생성·발송·업로드·광고 변경 없음. 호출 범위와 결과만 기록. 이력 저장소 준비 전에는 실행하지 않음.
      responses:
        "200": { description: ok 및 checks. ok는 이번 호출 결과이며 최근 실패 이력은 그대로 유지 }
        "400": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "429": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
    patch:
      summary: 관리자가 연결의 정·부 담당 변경
      description: service, primaryOwner, backupOwner, expectedVersion 필요. 활성 구성원만 지정하고 중복 정·부는 거절. 버전 충돌 시 409. 일반 사용자와 AI 키는 거절.
      responses:
        "200": { description: 담당 저장 완료 }
        "400": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /api/v1/telegram/setup:
    get:
      summary: 관리자가 봇과 웹훅 상태 확인
      responses:
        "200": { description: 비밀값을 제외한 Bot API 연결 상태 }
        "403": { $ref: "#/components/responses/ApiError" }
    post:
      summary: 관리자가 보안 웹훅 연결·갱신
      responses:
        "200": { description: 등록된 공개 웹훅 URL }
        "403": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /api/v1/my-work:
    get:
      summary: 로그인한 사람의 받은 일·검토·요청 목록
      description: 사용자 JWT 전용. RLS로 읽은 업무와 문서에 본인·상태 조건을 적용하며 시장·테스트·보관 항목은 제외합니다. 각각 최근 1000개 범위이며 초과하면 truncated=true입니다.
      responses:
        "200":
          description: private no-store 개인 목록
          content:
            application/json:
              schema:
                type: object
                required: [tabs, truncated, checkedAt]
                properties:
                  tabs:
                    type: object
                    properties:
                      received: { type: array, items: { $ref: "#/components/schemas/PersonalWorkItem" } }
                      review: { type: array, items: { $ref: "#/components/schemas/PersonalWorkItem" } }
                      requested: { type: array, items: { $ref: "#/components/schemas/PersonalWorkItem" } }
                  truncated: { type: boolean }
                  checkedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/notifications:
    get:
      summary: 현재 원본 접근 권한을 확인한 개인 통합 알림
      description: 사용자 JWT 전용. 기존 개발 알림 API는 유지합니다. 원본이 보관되거나 접근 권한을 잃으면 제목·미읽음 건수에서 제외합니다. 최근 100개 범위. GET은 읽음 상태를 변경하지 않습니다.
      responses:
        "200":
          description: notifications(id,title,reason,href,createdAt,readAt), unread, truncated. reason은 assignment/review/approval/blocked/status_change. readAt의 빈 문자열은 미읽음.
        "503": { description: 추가 마이그레이션 미적용 또는 알림 저장소 확인 실패. 기존 개발 알림 API는 독립적으로 유지됨. }
    patch:
      summary: 본인 알림 읽음 처리
      description: 원본 RLS를 다시 확인하고 알림 버전 조건으로 갱신합니다. 다른 수신자의 ID가 섞이면 갱신 전에 404, 중복 ID는 400, 충돌은 409입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
      responses:
        "200": { description: read 건수와 readAt }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /api/v1/development-requests:
    patch:
      summary: 개발 요청 상태·처리 결과 갱신
      description: 기존 계약을 유지하고 관리자 전용 plainSummary(240자), nextAction(500자), holdReason(2000자), reviewDate(YYYY-MM-DD 또는 빈 문자열)를 선택 필드로 추가합니다. id와 expectedVersion 필수. 기존 필드의 권한은 그대로입니다. 요약 마이그레이션 적용 전 새 필드를 보내면 503입니다.
      responses:
        "200": { description: 갱신된 record }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase 사용자 JWT 또는 범위가 지정된 bos_pat 토큰(knowledge.read/knowledge.write/records.read/records.write)
  schemas:
    PersonalWorkItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, description: 표시용 한국어 상태 }
        dueDate: { type: string, nullable: true }
        href: { type: string }
        kind: { type: string }
        nextAction: { type: string }
    RecordType:
      type: string
      enum: [project, task, goal, kpi, decision, meeting, ai_job, content_topic, content_script, content_package, content_short, content_publish, content_metric, skill, knowledge_link, revenue, funnel, crm_action, customer, brand, connection, access_rule, company_setting, channel]
    RecordCreate:
      type: object
      required: [recordType, title]
      properties:
        recordType: { $ref: "#/components/schemas/RecordType" }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        status: { type: string, minLength: 1, maxLength: 40 }
        priority: { type: string, enum: [low, normal, high, urgent] }
        brand: { type: string, maxLength: 120 }
        team: { type: string, maxLength: 120 }
        assigneeId: { type: [string, "null"], format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        dueDate: { type: [string, "null"], format: date }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        progress: { type: integer, minimum: 0, maximum: 100 }
        metricTarget: { type: [number, "null"] }
        metricCurrent: { type: [number, "null"] }
        metricUnit: { type: string, maxLength: 30 }
        amount: { type: [number, "null"] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        sourceUrl: { type: [string, "null"], format: uri }
        tags: { type: array, maxItems: 30, items: { type: string, maxLength: 60 } }
    DocumentStatus:
      type: string
      enum: [draft, team, review, reviewed, canonical, archived]
    DocumentCreate:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 1500000 }
        folder: { type: string, maxLength: 160 }
        brand: { type: string, maxLength: 120 }
        team: { type: string, maxLength: 120 }
        tags: { type: array, maxItems: 30, items: { type: string, maxLength: 60 } }
        source: { type: string, maxLength: 40 }
        sourceRef: { type: [string, "null"], maxLength: 500 }
    IndexCoverage:
      type: object
      required: [total, done, failed, pending, running, untracked, historicalFailed, failureReasons, capturedAt, truncated]
      properties:
        total: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        untracked: { type: integer, minimum: 0 }
        historicalFailed: { type: integer, minimum: 0, description: 조회된 활성 문서 범위에서 제외한 과거 실패 작업 수 }
        capturedAt: { type: string, format: date-time }
        truncated: { type: boolean }
        failureReasons:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [superseded, archived, timeout, rate_limit, quota, authentication, configuration, storage, provider, unknown] }
              label: { type: string }
              count: { type: integer, minimum: 0 }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        mode: { type: string, enum: [hybrid, keyword, semantic], default: hybrid }
        quick: { type: boolean, default: false, description: true이면 임베딩/RPC를 건너뛰고 요청자 권한 내 문서 단어 검색 결과를 먼저 반환 }
        topK: { type: integer, minimum: 1, maximum: 30, default: 10 }
        filters:
          type: object
          properties:
            statuses: { type: array, items: { $ref: "#/components/schemas/DocumentStatus" } }
            folder: { type: string }
            brand: { type: string }
    SearchResponse:
      type: object
      required: [query, mode, degraded, results, tookMs]
      properties:
        query: { type: string }
        mode: { type: string }
        degraded: { type: boolean }
        tookMs: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [documentId, title, text, score, citation]
            properties:
              documentId: { type: string, format: uuid }
              chunkId: { type: [integer, string, "null"] }
              title: { type: string }
              text: { type: string }
              score: { type: number }
              citation:
                type: object
                properties:
                  documentId: { type: string, format: uuid }
                  version: { type: [integer, "null"] }
                  chunkId: { type: [integer, string, "null"] }
  responses:
    ApiError:
      description: 표준 오류 본문
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: {}
