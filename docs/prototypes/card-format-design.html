<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드뉴스 포맷 기획</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#242822;font:16px/1.65 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:36px 5vw}header{border-bottom:2px solid;padding-bottom:15px}small{color:#536451}h1,h2,h3,p{margin:6px 0 14px}button,select,textarea{font:inherit;border:1px solid #acb3a8;border-radius:6px;padding:9px;background:white}button{cursor:pointer}button[aria-pressed=true],#save{background:#294738;color:white}nav{display:flex;gap:8px;flex-wrap:wrap}section{margin:24px 0}article{background:#fff;padding:22px;border:1px solid #d8dcd4;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}textarea,select{width:100%}label{display:block;margin:12px 0}.slide{background:#edf1e9;border-left:4px solid #57705b;padding:14px 18px;margin:8px 0}output{display:block;color:#365b47}
</style><main><header><small>브랜디 OS / 카드 만들기 / 로컬 기획 시안</small><h1>카드뉴스 포맷 고르기</h1></header><section><h2>1. 전달 방식</h2><nav id="nav"></nav></section><div class="grid"><article><h2>2. 내용 분류</h2><label>선택한 방식에 맞는 구성<select id="sub"></select></label><h3>예시 주제</h3><p>퇴근 후에도 일이 떠오를 때</p><div id="preview"></div></article><article><h2>3. 정본 프롬프트 다듬기</h2><small>정본 예시 v1 · 같은 주제로 비교</small><p id="base"></p><label>이 유형에 추가할 편집 지시<textarea id="edit" rows="4" placeholder="원고와 화면에서 무엇을 더 구체화할까요?"></textarea></label><button id="save">후보 버전 저장·비교</button><output id="status" aria-live="polite"></output><div id="comparison"></div></article></div></main><script>
const formats={
안내형:[['실행 절차','독자가 오늘 실행할 순서를 동사로 쓴다','메모를 열어요','내일 가장 먼저 할 일 하나를 적어요'],['체크리스트','한 장에 한 가지 확인 질문을 둔다','퇴근 전 확인할 것','내일 할 일이 한 문장으로 적혀 있나요?'],['사용 안내','도구의 동작 전후를 보여준다','알림 시간을 정해요','업무 앱에서 내일 아침을 선택해요']],
웹툰형:[['일상 공감','표정과 행동으로 감정을 보여준다','집에 왔는데 왜 회의 중이지?','소파에 앉은 주인공 머리 위에 회의 말풍선이 뜬다'],['대화극','서로 다른 관점을 두 인물의 대사로 쓴다','아직도 일해?','친구가 묻는다. 노트북은 닫았는데 머리는 그대로야.']],
스토리형:[['경험담','사건과 선택의 변화를 시간순으로 쓴다','그날도 저녁을 놓쳤다','식탁에서 회의 답변을 다시 쓰다가 국이 식었다'],['사례 전후','같은 상황에서 달라진 행동을 대비한다','어제와 달라진 퇴근길','어제는 메신저를 열었다. 오늘은 내일 볼 메모만 남겼다.']],
정보전달형:[['개념 설명','개념 하나를 관찰 가능한 예로 설명한다','생각이 반복되는 순간','끝난 대화를 머릿속에서 다시 말해 본 경험을 떠올려 보세요'],['비교','같은 기준으로 두 선택을 대조한다','기억하기와 기록하기','기억하기는 계속 떠올려야 하고 기록하기는 내일 확인할 곳을 남긴다'],['오해와 사실','주장과 근거를 분리하고 출처를 확인한다','바쁘면 누구나 그런 걸까?','개인 경험과 일반화할 수 있는 주장을 나누어 본다']]};
let family;const el=id=>document.getElementById(id);function draw(){const row=formats[family][el('sub').selectedIndex],key='card-ux:'+family+row[0];el('preview').replaceChildren(...row.slice(2).map((s,i)=>{const d=document.createElement('div');d.className='slide';d.textContent=(i?'본문 예시 · ':'표지 예시 · ')+s;return d}));el('base').textContent=row[1];const v=JSON.parse(localStorage.getItem(key)||'null');el('edit').value=v?.text||'';el('status').textContent='';el('comparison').textContent=v?'후보 v'+v.n+' · '+row[1]+' / '+v.text:'';el('save').onclick=()=>{const text=el('edit').value.trim();if(!text){el('status').textContent='추가할 편집 지시를 입력해 주세요.';return}localStorage.setItem(key,JSON.stringify({text,n:(v?.n||1)+1}));draw();el('status').textContent='이 브라우저에 후보를 저장했습니다.'}}
function choose(f){family=f;for(const b of el('nav').children)b.setAttribute('aria-pressed',String(b.textContent===f));el('sub').replaceChildren(...formats[f].map(r=>new Option(r[0])));draw()}for(const k of Object.keys(formats)){const b=document.createElement('button');b.textContent=k;b.onclick=()=>choose(k);el('nav').append(b)}el('sub').onchange=draw;choose('안내형')
</script></html>
